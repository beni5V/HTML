<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter App</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #9FE2BF, #7bd6d2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: beige;
            width: 380px;
            padding: 35px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        p {
            color: #777;
            margin-bottom: 25px;
        }

        #counter {
            font-size: 70px;
            font-weight: bold;
            color: #2a52f3;
            margin: 20px 0;
        }

        .counter-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        button {
            border: none;
            padding: 12px 22px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.05);
        }

        .minus {
            background: #ff6b6b;
            color: white;
        }

        .plus {
            background: #51cf66;
            color: white;
        }

        .stopwatch {
            border-top: 2px solid #eee;
            padding-top: 25px;
        }

        #time {
            font-size: 35px;
            font-weight: bold;
            color: #333;
            margin: 15px 0;
        }

        .start {
            background: #667eea;
            color: white;
        }

        .pause {
            background: #ffa94d;
            color: white;
        }

        .reset {
            background: #343a40;
            color: white;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Counter App</h1>
        <p>Counter & Stopwatch using JavaScript</p>

        <h2>Counter</h2>

        <div id="counter">0</div>

        <div class="counter-buttons">
            <button class="minus" onclick="decrease()">−</button>
            <button class="plus" onclick="increase()">+</button>
        </div>

        <div class="stopwatch">

            <h2>Stopwatch</h2>

            <div id="time">00:00:00</div>

            <button class="start" onclick="startTimer()">Start</button>
            <button class="pause" onclick="pauseTimer()">Pause</button>
            <button class="reset" onclick="resetTimer()">Reset</button>

        </div>

    </div>


    <script>

        let count = 0;

        function increase() {
            count++;
            document.getElementById("counter").innerText = count;
        }

        function decrease() {
            count--;
            document.getElementById("counter").innerText = count;
        }



        let seconds = 0;
        let timer = null;

        function updateTime() {

            let hours = Math.floor(seconds / 3600);
            let minutes = Math.floor((seconds % 3600) / 60);
            let secs = seconds % 60;

            hours = String(hours).padStart(2, "0");
            minutes = String(minutes).padStart(2, "0");
            secs = String(secs).padStart(2, "0");

            document.getElementById("time").innerText =
                hours + ":" + minutes + ":" + secs;
        }

        function startTimer() {

            if (timer !== null) {
                return;
            }

            timer = setInterval(function() {
                seconds++;
                updateTime();
            }, 1000);
        }

        function pauseTimer() {

            clearInterval(timer);
            timer = null;
        }

        function resetTimer() {

            clearInterval(timer);
            timer = null;

            seconds = 0;
            updateTime();
        }
    </script>

</body>
</html>
