<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Number App</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #000;
        }

        .app {
            width: 360px;
            padding: 30px;
            text-align: center;
            background: #111;
            border: 5px solid #fff;
            border-radius: 30px;
            box-shadow: 0 12px 0 #444,
                        0 20px 35px rgba(255, 255, 255, 0.15);
        }

        h1 {
            color: #fff;
            font-size: 28px;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        .number-box {
            width: 220px;
            height: 135px;
            margin: auto;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #fff;
            border: 5px solid #000;
            border-radius: 20px;

            box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        #number {
            font-size: 75px;
            font-weight: bold;
            color: #000;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 25px;
        }

        button {
            padding: 12px 20px;

            border: 3px solid #fff;
            border-radius: 25px;

            background: #000;
            color: #fff;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;

            box-shadow: 0 4px 0 #555;
            transition: 0.2s;
        }

        button:hover {
            background: #fff;
            color: #000;
        }

        button:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .click-box {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;

            margin-top: 25px;

            color: #fff;
            font-size: 17px;
            font-weight: bold;
        }

        #clickCount {
            min-width: 45px;
            padding: 7px 12px;

            background: #fff;
            color: #000;

            border-radius: 15px;
            border: 3px solid #000;
        }

        .status {
            display: inline-block;

            margin-top: 15px;
            padding: 9px 22px;

            background: #fff;
            color: #000;

            border: 3px solid #000;
            border-radius: 20px;

            font-weight: bold;
        }

        .info {
            margin-top: 20px;

            color: #ccc;
            font-size: 14px;
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <div class="app">

        <h1>RANDOM NUMBER</h1>

        <div class="number-box">
            <span id="number">73</span>
        </div>

        <div class="buttons">
            <button id="changeBtn">STOP</button>
            <button id="restartBtn">RESTART</button>
        </div>

        <div class="click-box">
            <span>CLICKS</span>
            <span id="clickCount">0</span>
        </div>

        <div id="status" class="status">
            CHANGING
        </div>

        <p class="info">
            Odd click → STOP<br>
            Even click → START
        </p>

    </div>


    <script>
        const number = document.getElementById("number");
        const changeBtn = document.getElementById("changeBtn");
        const restartBtn = document.getElementById("restartBtn");
        const clickCount = document.getElementById("clickCount");
        const status = document.getElementById("status");

        let clicks = 0;
        let changing = true;

        function generateNumber() {
            return Math.floor(Math.random() * 100) + 1;
        }

        setInterval(function () {

            if (changing) {
                number.textContent = generateNumber();
            }

        }, 500);


        changeBtn.addEventListener("click", function () {

            clicks++;

            clickCount.textContent = clicks;

            if (clicks % 2 !== 0) {

                changing = false;

                status.textContent = "STOPPED";

                changeBtn.textContent = "START";

            }

            else {

                changing = true;

                status.textContent = "CHANGING";

                changeBtn.textContent = "STOP";
            }
        });


        restartBtn.addEventListener("click", function () {

            clicks = 0;

            clickCount.textContent = "0";

            number.textContent = "73";

            changing = true;

            status.textContent = "CHANGING";

            changeBtn.textContent = "STOP";
        });
    </script>

</body>
</html>
